<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setări Server Remote</title>
    <style>
        :root {
            /* Valorile implicite (vor fi suprascrise de JS) */
            --bg-color: #0A0B10;
            --card-bg: rgba(255, 255, 255, 0.04);
            --text: #FFFFFF;
            --subtext: rgba(255, 255, 255, 0.4);
            --primary: #007AFF;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        h2 {
            margin-top: 0;
            color: var(--text);
            text-align: center;
            font-weight: 700;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            color: var(--subtext);
            font-weight: 600;
            border-bottom: 2px solid transparent;
            transition: color 0.3s ease, border-color 0.3s ease;
        }

        .tab.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .status-badge {
            display: block;
            text-align: center;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }
        
        .status-online {
            background-color: rgba(52, 199, 89, 0.2);
            color: #34C759;
            border-color: rgba(52, 199, 89, 0.3);
        }

        .status-offline {
            background-color: rgba(255, 59, 48, 0.2);
            color: #FF3B30;
            border-color: rgba(255, 59, 48, 0.3);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text);
        }

        input[type="text"], input[type="password"], input[type="number"] {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background-color: var(--card-bg);
            color: var(--text);
            box-sizing: border-box;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--card-bg);
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .toggle-container span {
            font-weight: 600;
            color: var(--text);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(150, 150, 150, 0.3);
            transition: .4s;
            border-radius: 28px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        .hint {
            font-size: 12px;
            color: var(--subtext);
            margin-top: 5px;
            display: block;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn-primary:hover {
            opacity: 0.8;
        }

        .color-picker {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        .color-dot {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
        }

        .color-dot:hover {
            transform: scale(1.1);
        }

        .color-dot.active {
            border-color: var(--text);
        }

        /* --- Custom Dropdown --- */
        .custom-select-wrapper {
            position: relative;
            user-select: none;
            width: 100%;
            margin-bottom: 25px;
        }
        .custom-select {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background-color: var(--card-bg);
            color: var(--text);
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .custom-select:hover, .custom-select.open {
            border-color: var(--primary);
        }
        .custom-select .arrow {
            transition: transform 0.3s ease;
        }
        .custom-select.open .arrow {
            transform: rotate(180deg);
        }
        .custom-options {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: var(--dropdown-bg, var(--card-bg));
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-top: 5px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            z-index: 100;
            display: none;
            max-height: 200px;
            overflow-y: auto;
            backdrop-filter: blur(20px);
        }
        .custom-select.open + .custom-options {
            display: block;
        }
        .custom-option {
            padding: 12px 15px;
            color: var(--text);
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .custom-option:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .custom-option.selected {
            color: var(--primary);
            font-weight: bold;
        }

        /* --- Custom Modal Alert --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background-color: var(--border);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background-color: var(--subtext);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            width: 80%;
            max-width: 350px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-box {
            transform: scale(1);
        }
        .modal-title {
            margin-top: 0;
            font-size: 20px;
            color: var(--text);
            font-weight: 700;
        }
        .modal-msg {
            color: var(--subtext);
            font-size: 15px;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .btn-modal {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s ease;
        }
        .btn-modal:hover {
            opacity: 0.8;
        }
        
        /* Custom scrollbar for custom options */
        .custom-options::-webkit-scrollbar {
            width: 6px;
        }
        .custom-options::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-options::-webkit-scrollbar-thumb {
            background-color: var(--border);
            border-radius: 10px;
        }
    </style>
    <div class="container">
        <!-- Client Connection Indicator -->
        <div id="clientIndicator" style="display: flex; align-items: center; background-color: var(--card-bg); padding: 8px 12px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 20px; align-self: flex-start; transition: all 0.3s ease;">
            <div id="clientIndicatorDot" style="width: 10px; height: 10px; border-radius: 50%; background-color: #FF3B30; margin-right: 8px; transition: background-color 0.3s ease;"></div>
            <span id="clientIndicatorText" style="font-size: 13px; font-weight: 600; color: var(--text);" data-i18n="client_disconnected">Fără Client</span>
        </div>

        <h2 data-i18n="settings_title">Setări Server Remote</h2>

        <div class="tabs">
            <div class="tab active" data-target="tab-server" data-i18n="remote_title">Conexiune</div>
            <div class="tab" data-target="tab-aspect" data-i18n="appearance">Aspect</div>
        </div>

        <!-- TAB CONEXIUNE -->
        <div id="tab-server" class="tab-content active">
            <div id="statusBadge" class="status-badge status-offline" data-i18n="disconnected">
                Status: Offline
            </div>

            <div class="form-group">
                <label for="password" data-i18n="server_password">Parolă Conexiune (Siguranță)</label>
                <input type="password" id="password" placeholder="***">
            </div>

            <div class="form-group toggle-container">
                <span data-i18n="auto_startup">Pornire Automată</span>
                <label class="switch">
                    <input type="checkbox" id="autoStartup">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="form-group toggle-container">
                <div>
                    <span data-i18n="auto_port">Port Automat</span>
                    <span class="hint" data-i18n="auto_port_hint">Alocat de Windows</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="autoPort" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="form-group" id="manualPortGroup" style="display: none;">
                <label for="manualPort" data-i18n="manual_port">Port Manual (1024 - 65535)</label>
                <input type="number" id="manualPort" min="1024" max="65535" placeholder="8080">
            </div>

            <button class="btn-primary" id="saveServerBtn" data-i18n="save_and_start">Salvează & Pornește</button>
        </div>

        <!-- TAB ASPECT -->
        <div id="tab-aspect" class="tab-content">
            <div class="form-group">
                <label data-i18n="language">Limbă</label>
                <div class="custom-select-wrapper" id="languageSelectWrapper">
                    <div class="custom-select" id="customSelectDisplay">
                        <span id="customSelectText">Română</span>
                        <span class="arrow">▼</span>
                    </div>
                    <div class="custom-options" id="customOptionsContainer">
                        <!-- Options populated by JS -->
                    </div>
                </div>
            </div>

            <div class="form-group toggle-container" style="margin-bottom: 25px;">
                <span data-i18n="dark_mode">Mod Întunecat (Dark Mode)</span>
                <label class="switch">
                    <input type="checkbox" id="darkModeToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="form-group">
                <label data-i18n="theme_color">Culoare Accent</label>
                <div class="color-picker" id="colorPicker">
                    <!-- Culorile for fi generate din JS -->
                </div>
            </div>
            
            <button class="btn-primary" id="saveThemeBtn" data-i18n="save_appearance">Salvează Aspectul</button>
        </div>

    </div>

    <!-- Modal Alert -->
    <div class="modal-overlay" id="customAlertOverlay">
        <div class="modal-box">
            <h3 class="modal-title" id="customAlertTitle">Eroare</h3>
            <p class="modal-msg" id="customAlertMsg">Mesaj de eroare</p>
            <button class="btn-modal" id="customAlertBtn" data-i18n="ok_button">OK</button>
        </div>
    </div>

    <script src="translations.js"></script>
    <script src="renderer.js"></script>
</body>
</html>
