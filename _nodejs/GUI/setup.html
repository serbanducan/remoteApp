<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Setup</title>
    <style>
        :root {
            --theme-color: #007AFF; 
            --bg-color: #0A0B10;
            --card-bg: rgba(255, 255, 255, 0.04);
            --border-color: rgba(255, 255, 255, 0.1);
            --glass-input: rgba(0, 0, 0, 0.2);
            --text-white: #FFFFFF;
            --sub-text: rgba(255, 255, 255, 0.4);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .background-accent {
            position: absolute;
            top: 0;
            right: 0;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle at top right, var(--theme-color), transparent 70%);
            opacity: 0.3;
            z-index: -1;
        }

        .container {
            width: 380px;
            padding: 35px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        h1 { font-size: 34px; font-weight: 900; text-transform: uppercase; letter-spacing: -1px; margin: 0; }
        .underline { width: 45px; height: 5px; background-color: var(--theme-color); margin: 8px 0 35px 0; border-radius: 2px; }
        .section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--sub-text); margin-bottom: 15px; display: block; }

        .input-group { margin-bottom: 25px; }
        .password-wrapper { position: relative; display: flex; align-items: center; }
        
        .password-wrapper input {
            width: 100%; height: 55px; background: var(--glass-input); border: 1px solid var(--border-color);
            border-radius: 14px; padding: 0 50px 0 18px; color: white; font-size: 16px; box-sizing: border-box; outline: none; transition: border-color 0.3s;
        }
        .password-wrapper input:focus { border-color: var(--theme-color); }

        .toggle-password {
            position: absolute; right: 15px; width: 24px; height: 24px; cursor: pointer; opacity: 0.5; transition: 0.3s; filter: invert(1); 
        }
        .toggle-password:hover { opacity: 1; }

        .toggle-row {
            display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color); padding: 18px; border-radius: 20px; margin-bottom: 35px;
        }

        .switch { position: relative; display: inline-block; width: 52px; height: 30px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255, 255, 255, 0.1); transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--theme-color); }
        input:checked + .slider:before { transform: translateX(22px); }

        .btn-save {
            width: 100%; height: 60px; border-radius: 30px; border: 1px solid var(--theme-color);
            background: linear-gradient(135deg, rgba(0, 122, 255, 0.4), rgba(0, 122, 255, 0.1));
            color: white; font-size: 16px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; transition: 0.3s; outline: none;
        }
        .btn-save:hover { background: linear-gradient(135deg, rgba(0, 122, 255, 0.6), rgba(0, 122, 255, 0.2)); transform: translateY(-1px); }
    </style>
</head>
<body>
    <div class="background-accent"></div>
    
    <div class="container">
        <h1>Settings</h1>
        <div class="underline"></div>

        <form id="setupForm" action="/save" method="POST">
            <span class="section-title">Securitate</span>
            <div class="input-group">
                <div class="password-wrapper">
                    <input type="password" id="serverPassword" name="password" placeholder="Parolă Server" required>
                    <img src="/icons/hide-icon.png" id="toggleIcon" class="toggle-password" alt="Toggle">
                </div>
            </div>

            <span class="section-title">Sistem</span>
            <div class="toggle-row">
                <span>Pornire automată</span>
                <label class="switch">
                    <input type="checkbox" name="startup">
                    <span class="slider"></span>
                </label>
            </div>

            <button type="submit" class="btn-save">Salvează Setările</button>
        </form>
    </div>

    <script>
        // Logica pentru vizibilitatea parolei (Ochiul magic)
        const passwordInput = document.getElementById('serverPassword');
        const toggleIcon = document.getElementById('toggleIcon');

        toggleIcon.addEventListener('click', function () {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            this.src = isPassword ? '/icons/visible-icon.png' : '/icons/hide-icon.png';
        });

        // ==========================================
        // SISTEMUL DE HEARTBEAT (PULS CĂTRE SERVER)
        // ==========================================
        // Trimitem un semnal POST către /ping în fiecare secundă
        // Dacă închidem pagina, scriptul se oprește, serverul nu mai primește ping și declanșează pornirea
        setInterval(() => {
            fetch('/ping', { 
                method: 'POST',
                keepalive: true 
            }).catch(() => {
                // Erorile apar aici doar în secunda în care serverul se închide, deci le ignorăm tăcut
            });
        }, 1000);
    </script>
</body>
</html>
